html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #000;
  overflow: hidden;
  font-family: "PlexClock", "Helvetica Neue Light", "HelveticaNeue-Light", "Helvetica Neue", sans-serif-light, Menlo, monospace;
  font-weight: 200;
  -webkit-tap-highlight-color: rgba(0,0,0,0);
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
* { font-weight: 200; }
#wrap {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: table;
}
#cell {
  display: table-cell;
  vertical-align: middle;
  text-align: center;
  color: #fff;
  opacity: 0;
  -webkit-transition: opacity 1s ease;
  -moz-transition: opacity 1s ease;
  transition: opacity 1s ease;
}
#cell.on { opacity: 1; }
#date { font-size: 20px; letter-spacing: 2px; color: #ccc; margin-bottom: 8px; }
#time { white-space: nowrap; font-size: 80px; line-height: 1; }
#sec  { font-size: 24px; color: #aaa; margin-left: 6px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="cell">
    <div id="date"></div>
    <div id="time"><span id="hm"></span><span id="sec"></span></div>
  </div>
</div>
<script>
(function () {
  var cell = document.getElementById('cell');
  var elDate = document.getElementById('date');
  var elTime = document.getElementById('time');
  var elHm = document.getElementById('hm');
  var elSec = document.getElementById('sec');
  var days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
  var timer = null;
  var isOn = false;

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function setText(el, t) {
    if (el.firstChild) { el.firstChild.nodeValue = t; }
    else { el.appendChild(document.createTextNode(t)); }
  }

  function update() {
    var d = new Date();
    setText(elDate, d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate()) + ' ' + days[d.getDay()]);
    setText(elHm, pad(d.getHours()) + ':' + pad(d.getMinutes()));
    setText(elSec, pad(d.getSeconds()));
  }

  function resize() {
    var w = window.innerWidth || document.documentElement.clientWidth;
    var h = window.innerHeight || document.documentElement.clientHeight;
    var size = Math.min(w * 0.24, h * 0.5);
    elTime.style.fontSize = Math.floor(size) + 'px';
    elSec.style.fontSize = Math.floor(size * 0.3) + 'px';
    elSec.style.marginLeft = Math.floor(size * 0.08) + 'px';
    elDate.style.fontSize = Math.floor(size * 0.2) + 'px';
    elDate.style.marginBottom = Math.floor(size * 0.1) + 'px';
  }

  function show() {
    update();
    cell.className = 'on';
    if (timer) { clearTimeout(timer); }
    timer = setTimeout(function () { cell.className = ''; }, 10000);
  }

  update();
  resize();
  setInterval(update, 500);
  window.onresize = resize;
  window.onorientationchange = function () { setTimeout(resize, 300); };

  var touched = false;
  document.addEventListener('touchstart', function (e) {
    touched = true;
    if (e.preventDefault) { e.preventDefault(); }
    show();
  }, false);
  document.addEventListener('click', function () {
    if (touched) { touched = false; return; }
    show();
  }, false);
})();
</script>
</body>
</html>
